<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background -->
  <rect width="64" height="64" fill="#050202"/>

  <!-- Outer gold border frame -->
  <rect x="3" y="3" width="58" height="58" stroke="#C9A84C" stroke-width="1" fill="none" opacity="0.6"/>

  <!-- Inner corner ornaments -->
  <!-- Top-left -->
  <path d="M3 10 L3 3 L10 3" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
  <!-- Top-right -->
  <path d="M54 3 L61 3 L61 10" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
  <!-- Bottom-left -->
  <path d="M3 54 L3 61 L10 61" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
  <!-- Bottom-right -->
  <path d="M54 61 L61 61 L61 54" stroke="#C9A84C" stroke-width="1.5" fill="none"/>

  <!-- Dagger blade -->
  <path d="M32 8 L35 30 L32 34 L29 30 Z" fill="url(#blade-gradient)"/>

  <!-- Dagger crossguard -->
  <rect x="24" y="30" width="16" height="3" rx="1" fill="#C9A84C" opacity="0.9"/>

  <!-- Dagger handle -->
  <rect x="30" y="33" width="4" height="10" rx="1" fill="#A07C30"/>

  <!-- Dagger pommel -->
  <ellipse cx="32" cy="44" rx="3.5" ry="2.5" fill="#C9A84C" opacity="0.85"/>

  <!-- Dagger tip highlight -->
  <path d="M32 8 L33 16 L32 18 L31 16 Z" fill="white" opacity="0.25"/>

  <!-- Red eye above the dagger — the Traitor mark -->
  <ellipse cx="32" cy="22" rx="4" ry="2.5" fill="#8B0000" opacity="0.9"/>
  <ellipse cx="32" cy="22" rx="2" ry="1.5" fill="#e05555"/>
  <!-- Eye glow -->
  <ellipse cx="32" cy="22" rx="5" ry="3.5" fill="none" stroke="#e05555" stroke-width="0.5" opacity="0.4"/>

  <!-- Bottom text "T" -->
  <text
    x="32"
    y="58"
    text-anchor="middle"
    font-family="serif"
    font-size="7"
    font-weight="700"
    letter-spacing="3"
    fill="#C9A84C"
    opacity="0.7"
  >T</text>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="blade-gradient" x1="32" y1="8" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5E6C8"/>
      <stop offset="40%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#6B4C1A"/>
    </linearGradient>
  </defs>
</svg>